{% extends "base.html" %}

{% block content %}
<style>
:root {
    --bg-primary: #0f0f0f;
    --bg-secondary: #151515;
    --bg-tertiary: #1e1e1e;
    --border: #2d2d2d;
    --border-light: #3a3a3a;
    --text-primary: #ffffff;
    --text-secondary: #b0b0b0;
    --text-tertiary: #888888;
    --primary: #007aff;
    --success: #30d158;
    --warning: #ffd60a;
    --danger: #ff453a;
    --info: #32d7ee;
    --purple: #bf5af2;
}

.credits-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
}

.credits-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
}

.credits-title h1 {
    font-size: 1.5rem;
    margin: 0;
}

.credits-title p {
    margin: 0.25rem 0 0;
    color: var(--text-secondary);
    font-size: 0.9rem;
}

.credits-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    overflow: hidden;
}

.card-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.9rem 1.1rem;
    border-bottom: 1px solid var(--border-light);
    background: rgba(0, 0, 0, 0.2);
}

.header-icon {
    font-size: 1.2rem;
    color: var(--info);
}

.header-title {
    font-size: 1rem;
    font-weight: 700;
    margin: 0;
}

.card-content {
    padding: 1.1rem;
}

.credit-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1rem;
    font-size: 0.95rem;
}

.credit-summary strong {
    font-size: 1.1rem;
}

.form-control {
    width: 100%;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    padding: 0.65rem 0.75rem;
    margin-bottom: 0.8rem;
    font-size: 0.9rem;
}

.form-control:focus {
    outline: none;
    border-color: var(--info);
    box-shadow: 0 0 0 2px rgba(50, 215, 238, 0.2);
}

.small {
    display: block;
    margin-bottom: 0.4rem;
    color: var(--text-secondary);
    font-size: 0.8rem;
}

.action-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.7rem 1.2rem;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
}

.action-btn.primary {
    background: var(--info);
    color: var(--bg-primary);
    border: 1px solid var(--info);
}

.action-btn.primary:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(50, 215, 238, 0.3);
}
</style>

<div class="credits-container">
    <div class="credits-header">
        <div class="header-icon"><i data-feather="credit-card"></i></div>
        <div class="credits-title">
            <h1>Buy Credits</h1>
            <p>Top up your generation balance instantly.</p>
        </div>
    </div>

    <div class="credits-card">
        <div class="card-header">
            <div class="header-icon"><i data-feather="shopping-bag"></i></div>
            <h3 class="header-title">Select a Pack</h3>
        </div>
        <div class="card-content">
            <div class="credit-summary">
                <span>Current credits</span>
                <strong>{{ '%.3f'|format(generation_credits or 0) }}</strong>
            </div>
            <form method="POST" action="/buy-credits/create-session">
                <label class="small" for="credits">Choose amount</label>
                <select id="credits" name="credits" class="form-control" required>
                    {% for credits, amount in credit_packs.items() %}
                    <option value="{{ credits }}">{{ credits }} credits - ${{ "%.2f"|format(amount / 100) }}</option>
                    {% endfor %}
                </select>
                <button type="submit" class="action-btn primary">
                    <span>Checkout</span>
                    <div class="btn-icon"><i data-feather="arrow-right"></i></div>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

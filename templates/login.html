{% extends "base.html" %}
{% block content %}
<div class="profile-container">
    <div class="info-card">
        <div class="card-header">
            <div class="header-icon">🔐</div>
            <h3 class="header-title">Login</h3>
        </div>
        <div class="card-content">
            <form method="POST" class="verify-form">
                <div class="input-group">
                    <input type="text" name="username" placeholder="Username" class="form-input" required>
                    <input type="password" name="password" placeholder="Password" class="form-input" required>
                    <button type="submit" class="action-btn primary">
                        <span>Login</span>
                        <div class="btn-icon">➡️</div>
                    </button>
                </div>
            </form>

            <div class="divider"></div>

            <button type="button" class="action-btn secondary" onclick="startSecurityKeyLogin()">
                <span>Use Security Key</span>
                <div class="btn-icon">🔑</div>
            </button>

            <div class="auth-link">
                Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
            </div>
        </div>
    </div>
</div>

<style>
:root {
    --bg-primary: #0f0f0f;
    --bg-secondary: #151515;
    --bg-tertiary: #1e1e1e;
    --border: #2d2d2d;
    --text-primary: #ffffff;
    --text-secondary: #b0b0b0;
    --primary: #007aff;
}

.profile-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 1rem;
}

.info-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
}

.card-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: rgba(0, 0, 0, 0.2);
}

.header-title {
    color: var(--text-primary);
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0;
}

.card-content {
    padding: 1.5rem;
}

.verify-form {
    margin: 0;
}

.input-group {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 1rem;
}

.form-input {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.875rem 1rem;
    color: var(--text-primary);
    font-size: 1rem;
}

.form-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
}

.action-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.25rem;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--primary);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.2s ease;
}

.action-btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-primary);
    margin-top: 1rem;
}

.action-btn:hover {
    transform: translateY(-1px);
    opacity: 0.9;
}

.divider {
    height: 1px;
    background: var(--border);
    margin: 1.25rem 0;
}

.auth-link {
    margin-top: 1rem;
    color: var(--text-secondary);
}

.auth-link a {
    color: #7dd3fc;
}

@media (max-width: 800px) {
    .input-group {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
async function startSecurityKeyLogin() {
    const usernameInput = document.querySelector('input[name="username"]');
    const username = usernameInput ? usernameInput.value.trim() : "";
    if (!username) {
        alert("Enter your username first.");
        return;
    }

    const optionsRes = await fetch("/webauthn/login/options", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username })
    });

    const options = await optionsRes.json();
    if (!optionsRes.ok) {
        alert(options.error || "Unable to start security key login");
        return;
    }

    options.challenge = base64urlToBuffer(options.challenge);
    if (options.allowCredentials) {
        options.allowCredentials = options.allowCredentials.map(c => ({
            ...c,
            id: base64urlToBuffer(c.id)
        }));
    }

    const cred = await navigator.credentials.get({ publicKey: options });
    const credential = credentialToJSON(cred);

    const verifyRes = await fetch("/webauthn/login/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, credential })
    });

    const verifyData = await verifyRes.json();
    if (!verifyRes.ok) {
        alert(verifyData.error || "Security key login failed");
        return;
    }

    window.location.href = "/";
}

function base64urlToBuffer(base64url) {
    const padding = '='.repeat((4 - (base64url.length % 4)) % 4);
    const base64 = (base64url + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const buffer = new ArrayBuffer(raw.length);
    const view = new Uint8Array(buffer);
    for (let i = 0; i < raw.length; i++) {
        view[i] = raw.charCodeAt(i);
    }
    return buffer;
}

function bufferToBase64url(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = "";
    bytes.forEach((b) => (binary += String.fromCharCode(b)));
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function credentialToJSON(cred) {
    if (cred instanceof ArrayBuffer) {
        return bufferToBase64url(cred);
    }
    if (Array.isArray(cred)) {
        return cred.map(credentialToJSON);
    }
    if (cred && typeof cred === 'object') {
        const obj = {};
        for (const key in cred) {
            obj[key] = credentialToJSON(cred[key]);
        }
        return obj;
    }
    return cred;
}
</script>
{% endblock %}

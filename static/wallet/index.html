<!DOCTYPE html><html><head>
  <base href="./">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LunaWallet">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>LunaWallet</title>
  <link rel="manifest" href="manifest.json">

  <script>
    var flet = {
      pyodide: true,
      multiView: false,
      noCdn: "False".toLowerCase() == "true",
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "./",
      assetBase: "./",
      routeUrlStrategy: "path",
      canvasKitBaseUrl: "canvaskit/",
      pyodideUrl: "pyodide/pyodide.js",
      pythonModuleName: "main",
      webRenderer: "auto",
      fontFallbackBaseUrl: "assets/fonts/", // for Noto Emoji, use Google CDN
      appPackageUrl: "assets/app/app.zip"
    }

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });

    flet.flutterAppLoaded.then((flutterApp) => {
      console.log("Flutter app loaded");
      if (typeof hideLoadingOverlay === "function") {
        hideLoadingOverlay();
      }
    });
  </script>
  <script src="python.js"></script>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #222222;
          }
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.92);
      z-index: 9999;
      font-family: Arial, sans-serif;
      color: #222;
    }

    @media (prefers-color-scheme: dark) {
      #loading-overlay {
        background: rgba(18, 18, 18, 0.92);
        color: #eee;
      }
    }

    .loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px 28px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      min-width: 260px;
    }

    @media (prefers-color-scheme: dark) {
      .loading-card {
        background: rgba(32, 32, 32, 0.75);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      }
    }

    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-top-color: #3b82f6;
      animation: spin 1s linear infinite;
    }

    @media (prefers-color-scheme: dark) {
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.18);
        border-top-color: #60a5fa;
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      .progress-bar {
        background: rgba(255, 255, 255, 0.12);
      }
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #22c55e);
      transition: width 0.2s ease;
    }

    .loading-status {
      font-size: 14px;
      text-align: center;
      max-width: 260px;
      word-break: break-word;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    function showLoadingOverlay() {
      document.getElementById("loading-overlay")?.removeAttribute("hidden");
    }

    function hideLoadingOverlay() {
      document.getElementById("loading-overlay")?.setAttribute("hidden", "true");
    }

    function setLoadingStatus(message) {
      const el = document.getElementById("loading-status");
      if (el) {
        el.textContent = message || "Loading...";
      }
    }

    function setLoadingProgress(value) {
      const fill = document.getElementById("loading-progress");
      if (!fill) return;
      if (value == null || Number.isNaN(value)) {
        fill.style.width = "0%";
      } else {
        const clamped = Math.max(0, Math.min(100, value));
        fill.style.width = clamped + "%";
      }
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>

<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <script src="flutter_bootstrap.js" async=""></script>



</body></html>
